<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YDE Senior Fund - Auction Admin</title>
  <link rel="icon" type="image/png" href="/favicon/favicon.jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1222;
      background-image: linear-gradient(135deg, #0d1222 0%, #151a2d 100%);
    }

    .bebas-neue {
      font-family: 'Bebas Neue', sans-serif;
    }

    .glass-panel {
      background: rgba(43, 49, 63, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 767px) {
      #main-menu li {
        width: 100%;
      }

      #main-menu li a {
        display: block;
        text-align: center;
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col">
  <header class="bg-black/40 py-4 px-4 md:px-12 fixed w-full top-0 z-50 shadow-2xl backdrop-blur-sm">
    <nav class="container mx-auto flex justify-between items-center flex-wrap md:flex-nowrap">
      <div class="flex items-center justify-between w-full md:w-auto">
        <a href="/" class="flex items-center space-x-2">
          <img src="https://raw.githubusercontent.com/ToratYosef/ToratYosef..github.io/refs/heads/main/assets/logos.jpeg" alt="YDE Logo" class="h-14 sm:h-16 md:h-20 w-auto rounded-full ring-2 ring-yellow-400 p-1">
        </a>
        <button id="menu-toggle" class="md:hidden text-white focus:outline-none" aria-label="Toggle menu">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>
      <ul id="main-menu" class="hidden md:flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-8 text-base font-semibold w-full md:w-auto mt-4 md:mt-0">
        <li><a href="/rolex-raffle/" class="text-white hover:text-yellow-400 transition-colors duration-300 block">Rolex Raffle</a></li>
        <li><a href="/leaderboard/" class="text-white hover:text-yellow-400 transition-colors duration-300 block">Leaderboard</a></li>
        <li><a href="/auction/" class="py-2 px-4 rounded-full bg-yellow-400 text-black font-bold block">Auction</a></li>
        <li><a href="/donate/" class="text-white hover:text-yellow-400 transition-colors duration-300 block">Donate Now</a></li>
      </ul>
    </nav>
  </header>

  <main class="flex-grow pt-24 sm:pt-28 px-4 md:px-8 lg:px-16">
    <div class="container mx-auto max-w-7xl glass-panel rounded-2xl shadow-2xl p-4 sm:p-6 md:p-8">
      <section class="mb-6">
        <h1 class="bebas-neue text-5xl sm:text-6xl text-yellow-400">Auction Admin</h1>
        <p class="text-amber-300 text-sm sm:text-base">Admin access should be protected with auth claims in production.</p>
      </section>

      <section id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></section>

      <section class="rounded-xl border border-slate-700 bg-slate-900/55 p-4 mb-6">
        <h2 class="bebas-neue text-4xl text-yellow-400 mb-3">Package Totals</h2>
        <div id="packageTotals" class="grid md:grid-cols-2 gap-3"></div>
      </section>

      <section class="rounded-xl border border-slate-700 bg-slate-900/55 p-4 mb-6">
        <label for="search" class="text-sm uppercase tracking-wider text-slate-300">Search Orders</label>
        <input id="search" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="Search by name, email, or phone">
      </section>

      <section class="rounded-xl border border-slate-700 bg-slate-900/55 p-4 mb-8">
        <h2 class="bebas-neue text-4xl text-yellow-400 mb-3">Orders</h2>
        <p id="ordersInfo" class="text-slate-300 text-sm mb-3"></p>
        <div id="orders" class="grid gap-2"></div>
      </section>

      <section class="rounded-xl border border-slate-700 bg-slate-900/55 p-4 mb-8">
        <h2 class="bebas-neue text-4xl text-yellow-400 mb-3">Manual Entry</h2>
        <div id="manualForm" class="grid md:grid-cols-3 gap-3"></div>
        <p id="manualErr" class="text-red-300 min-h-6 mt-2"></p>
        <button id="manualSubmit" class="mt-1 bg-yellow-400 hover:bg-yellow-500 text-black font-bold px-4 py-2 rounded-lg transition-colors duration-300">Create Manual Entry</button>
      </section>

      <section class="rounded-xl border border-slate-700 bg-slate-900/55 p-4">
        <h2 class="bebas-neue text-4xl text-yellow-400 mb-3">Wheel of Names</h2>
        <div class="grid md:grid-cols-[1fr_auto_auto] gap-3 items-end mb-4">
          <label class="text-sm text-slate-300">Package
            <select id="wheelPackage" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 p-3 text-white"></select>
          </label>
          <button id="openWheel" class="h-12 bg-yellow-400 hover:bg-yellow-500 text-black font-semibold px-4 rounded-lg">Open Wheel of Names</button>
          <button id="openAllWheels" class="h-12 border border-yellow-300 hover:border-yellow-200 text-yellow-200 hover:text-yellow-100 font-semibold px-4 rounded-lg">Open All Spins</button>
        </div>
        <p id="wheelInfo" class="text-sm text-slate-300 mb-2"></p>
        <div id="wheelNames" class="rounded-lg border border-slate-700 bg-slate-950/70 p-3 text-sm text-slate-200 min-h-28"></div>
      </section>
    </div>
  </main>

  <footer class="bg-black/40 py-8 mt-auto shadow-[0_-5px_15px_rgba(0,0,0,0.5)]">
    <div class="container mx-auto px-4 text-center">
      <h3 class="bebas-neue text-3xl font-bold text-yellow-400 mb-4">Contact</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-gray-400 mb-8">
        <div>
          <p class="font-bold text-white">Morris E.</p>
          <p>+1 (848)-282-6434</p>
        </div>
        <div>
          <p class="font-bold text-white">Daniel K.</p>
          <p>+1 (917) 858-0904</p>
        </div>
        <div>
          <p class="font-bold text-white">Saul S.</p>
          <p>+1 (929)-584-5753</p>
        </div>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('main-menu').classList.toggle('hidden'));
  </script>
  <script src="/assets/js/auction-data.js"></script>
  <script type="module" src="/assets/js/auction-admin.js"></script>
</body>
</html>
