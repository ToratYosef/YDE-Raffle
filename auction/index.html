<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Auction</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-slate-100 min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-24">
  <h1 class="text-5xl font-bold text-yellow-400">Chinese Auction</h1>
  <p class="text-emerald-400 mt-2 font-semibold">Win over $26K in prizes.</p>
  <div class="grid md:grid-cols-3 gap-3 mt-8">
    <input id="name" class="rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="Full name">
    <input id="email" class="rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="Email">
    <input id="phone" class="rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="Phone">
  </div>
  <h2 class="text-2xl mt-8 mb-3 text-yellow-400">Ticket Bundles</h2><div id="bundles" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  <h2 class="text-2xl mt-8 mb-3 text-yellow-400">Packages</h2><div id="packages" class="grid md:grid-cols-2 gap-4"></div>
  <p id="err" class="text-red-400 mt-4"></p>
  <button id="checkout" class="mt-4 bg-yellow-400 text-black font-bold px-5 py-3 rounded-lg">Checkout</button>
</div>
<script src="/assets/js/auction-data.js"></script><script type="module" src="/assets/js/auction.js"></script>
</body></html>
